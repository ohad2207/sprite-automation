name: Update Sprites

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprite-data-update
  cancel-in-progress: false

jobs:
  update-sprites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update sprite season data
        run: node scripts/update-sprites.js

      - name: Commit and push changes
        run: |
          git config user.name "sprite-automation-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-update sprite data [skip ci]"
          git push
