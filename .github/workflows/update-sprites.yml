name: Update Sprites

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-sprites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run the sprite-update script
        run: node scripts/update-sprites.js

      - name: Commit and push if sprites.json changed
        run: |
          git config user.name "sprite-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sprites.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update sprites.json [skip ci]"
            git push
          fi
