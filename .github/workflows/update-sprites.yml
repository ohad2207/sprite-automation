name: Update Sprites

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprite-data-update
  cancel-in-progress: false

jobs:
  update-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update sprite season data (3 attempts)
        run: |
          for attempt in 1 2 3; do
            if node scripts/update-sprites.js; then
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          exit 1

      - name: Commit and push changes
        run: |
          git config user.name "sprite-automation-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-update sprite data [skip ci]"
          git pull --rebase
          git push
